[project]
name = "atria-backend"
version = "0.1.0"
description = "Atria Project Manager API"
requires-python = ">=3.11"
dependencies = [
    # API Framework
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.30.0",

    # ORM + DB
    "sqlmodel>=0.0.21",
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",         # Async driver for PostgreSQL

    # Settings
    "pydantic-settings>=2.3.0",

    # Auth
    "PyJWT>=2.8.0",

    # Storage
    "google-cloud-storage>=2.17.0",

    # Upload multipart
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",           # Test client async for FastAPI
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",             # Linter + formatter
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
